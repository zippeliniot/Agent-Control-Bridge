# Projektprofil der Agent Control Bridge selbst.
#
# BRIDGE-036: Umbenennung Teil A (Codex Control Bridge -> Agent Control Bridge).
# project_id, repository und github_repo auf den neuen Namen umgestellt;
# task_prefix bleibt bewusst BRIDGE (Nutzer-Entscheidung, kein Bezeichnungskonflikt
# wie bei "Codex").
schema_version: "1.0"
kind: bridge_project_profile
project_id: agent-control-bridge
description: Die Bridge selbst (Entwicklungsprojekt).
repository: Agent-Control-Bridge/dev
default_branch: main
task_prefix: BRIDGE
read_only: false
executor: claude-code
controller: human
review_roles:
  lead: anthropic
  support: openai
github_repo: zippeliniot/Agent-Control-Bridge
allowed_machines: [HAM11, DES11]
git_policy:
  allow_push: true
  allow_merge: false
  allow_force_push: false
  protected_branches: [main]
test_policy:
  command: "python -m unittest discover -s tests"
  required: true
handover_policy:
  branch: main
  require_clean: true
migration_policy:
  allow_production: false
