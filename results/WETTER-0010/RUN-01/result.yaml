summary: 'Ziel-Repo HEAD 1fc89b2. Fix in js/tanken.js: render() filtert Stationsliste
  jetzt auf isStationChecked() und Preiszeilen auf prefs.fuels; renderSortToggle()
  blendet Sortier-Buttons fuer abgewaehlte Sorten aus (kompletter Umschalter versteckt,
  wenn keine Sorte mehr ausgewaehlt); ensureValidSortKey() schaltet sortKey automatisch
  auf die naechste ausgewaehlte Sorte um (E5->E10->Diesel); eigene Hinweistexte fuer
  ''keine Stationen ausgewaehlt'' bzw. ''keine Sorte ausgewaehlt'' (getrennt vom bestehenden
  ''keine Stationen gefunden''); prefsChanged() ruft render() erneut auf; initialer
  sortKey-Default auf e10 umgestellt. Browser-Verifikation (lokaler http.server +
  Playwright/Chromium, Testdatei data/tanken.json mit 3 Stationen, danach geloescht/nicht
  committet) bestand alle 6 Punkte: Stationsabwahl wirkt sofort auf die Liste, Default
  zeigt korrekt nur E10/Diesel ohne E5-Sortier-Button, komplette Abwahl aller Sorten/Stationen
  zeigt jeweils den Hinweistext samt ausgeblendetem Umschalter, Abwahl der aktiven
  Sortier-Sorte E10 schaltet automatisch auf Diesel um, keine PageErrors (nur erwartete
  404 fuer externe API-Calls ohne Backend).'
