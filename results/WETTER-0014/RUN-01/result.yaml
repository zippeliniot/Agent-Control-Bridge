summary: 'Ziel-Repo HEAD bcae82b (Wetter-App, gepusht). Phone/iPad-hoch (390px/820px):
  Layout unveraendert - display:block, .page max-width 760px, kein Grid, kein Overflow
  (Bounding-Box-Vergleich gegen HEAD 5b9179f identisch). iPad-quer/Desktop (1180px/1366px):
  #main-view wird 2-spaltiges CSS-Grid (.page 1240px), Temperatur|Wind und Taschensee|Ostsee
  je in einer Reihe (sameRow bestaetigt), Blitz allein links, 7-Tage-Vorschau (#fc-card)/Controls/Stand-Zeile
  ueber volle Breite (grid-column:1/-1). Grosse Monitore (1920px/2560px): 3 Spalten
  (.page 1860px), gleiches Full-Width-Verhalten fuer fc-card/Controls/Stand. Kein
  horizontaler Overflow bei allen getesteten Breiten (scrollWidth<=innerWidth). Resize-Test
  (1920->1180->390, gleiche Seite ohne Reload): Chart-Canvas-Breite passt sich live
  an (587px->547px->340px). Standortwechsel Hamburg bei 1920px: Taschensee/Blitz/Ostsee
  werden ausgeblendet, Grid ordnet Temperatur+Wind ohne Luecken/Overflow neu; zurueck
  auf Gronenberg stellt alle Karten wieder her. Regen-/Tanken-Ansicht bleiben bei
  1920px 760px breit und zentriert (getestet ueber window.showTanken/hideTanken/showRegen/showMain),
  #main-view.hidden(!important) wirkt weiterhin, nach Rueckkehr wieder display:grid.
  Vollbild-Chart (openFS) funktioniert bei 1920px unveraendert (fs-modal.open=true).
  Browser-Konsole: keine neuen Fehler bei allen Checks, nur die erwarteten 404 auf
  lokal fehlende, scope-fremde hours.json/live.json/history.json. Scope eingehalten:
  nur index.html (CSS + id=fc-card).'
