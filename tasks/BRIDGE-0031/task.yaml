title: Maschinenaufloesung vereinheitlichen - COMPUTERNAME-Autodefault an allen Schreibstellen
  + BRIDGE_MACHINE-Inkonsistenz beseitigen
description: 'registry.machine_name() (explicit -> COMPUTERNAME -> platform.node())
  existiert bereits und ist korrekt, wird aber ausschliesslich innerhalb von resolve_base()
  aufgerufen (Pfadaufloesung fuer bridge board/bridge commands). Alle Audit-schreibenden
  Stellen reichen machine=None hartkodiert (task_copied(), task_archive() in cli.py,
  webui.py /api/run/<id>/finish) oder rohes args.machine ohne Fallback durch (task
  set-status, task set-priority, run start/beat/finish/resume) - dadurch tragen 0
  von 144 bestehenden Audit-Eintraegen einen machine-Wert. Fix: registry.machine_name(machine)
  an jeder dieser Stellen aufrufen statt None hartzukodieren bzw. roh durchzureichen.
  task copied und task archive bekommen zusaetzlich ein optionales --machine-Flag
  (fehlt bisher, anders als set-status/set-priority/run *). Zusaetzlich (April-Entscheidung,
  Steuerchat-Sitzung): zweiten, unabhaengigen Mechanismus in importer.py vereinheitlichen
  - import_result() loest machine aktuell ueber eine eigene, nie gesetzte Env-Var
  BRIDGE_MACHINE auf (getrennt von COMPUTERNAME), was den Actor "claude-code@unknown"
  in result.yaml/created_by und physical_machine=null erklaert. BRIDGE_MACHINE-Fallback
  durch registry.machine_name() ersetzen, danach nur noch eine Quelle der Maschinenaufloesung
  im gesamten System. Bestehende Audit-Eintraege werden NICHT rueckwirkend korrigiert
  (reine Vorwaertskorrektur). Neue Tests in test_cli.py, test_webui.py, test_importer.py
  fuer alle Aufrufstellen (COMPUTERNAME gesetzt -> Wert erscheint; expliziter --machine/machine=-Wert
  hat weiterhin Vorrang). Bestehende "?"-Fallback-Tests (kein Heartbeat, kein Audit-Eintrag)
  bleiben unveraendert gruen. Details in work-packages/BRIDGE-031.md.'
