acceptance_criteria:
- task copied und task archive haben ein optionales --machine-Flag
- task_copied()/task_archive()/task_set_priority() loesen die Maschine ueber registry.machine_name(machine)
  auf statt None hartzukodieren oder roh durchzureichen
- run start/beat/finish/resume (CLI) loesen args.machine vor Uebergabe an runner.*
  ueber registry.machine_name() auf
- result import (CLI) loest args.machine ebenso auf
- webui.py-Aktionsendpunkte (copied, archive, run finish) uebergeben registry.machine_name()
  statt None
- importer.import_result() nutzt registry.machine_name() statt der BRIDGE_MACHINE-Env-Var;
  BRIDGE_MACHINE wird im Code nirgendwo mehr referenziert
- Ohne --machine/expliziten machine-Parameter und mit gesetztem COMPUTERNAME - neue
  Audit-Eintraege sowie result.yaml (physical_machine, created_by) tragen die aufgeloeste
  Maschine, nicht null/unknown
- Mit explizitem --machine/machine=-Parameter - dieser hat weiterhin Vorrang vor COMPUTERNAME
- Bestehende Tests fuer den "?"-Fallback-Fall (kein Heartbeat, kein Audit-Eintrag)
  bleiben unveraendert gruen
- Neue Tests in test_cli.py, test_webui.py, test_importer.py fuer alle Aufrufstellen,
