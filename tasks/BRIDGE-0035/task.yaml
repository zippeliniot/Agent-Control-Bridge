  task_prefix "BRIDGE", default_branch "main" gebaut - unabhaengig vom tatsaechlichen
  --target. Ausserdem fehlt ein Pre-Flight-Vergleich gegen einen erwarteten Branch/HEAD.
  Dieser Auftrag ergaenzt neue optionale CLI-Argumente --project-id/--task-prefix/--expected-branch/--expected-head,
