  Verhalten), sowie einen fail-closed Pre-Flight-Head-Check direkt im Skript. Kein
  Linux-Executor-Dienst, kein API-/MCP-Adapter, keine Auftragsreservierung/Locking,
  keine Identitaetsverifikation - bewusst nicht Teil dieses Auftrags. Kein Zugriff
  auf das echte Dorfschaft-Repository, getestet ausschliesslich gegen synthetische
  Temp-Git-Repos. Details in work-packages/BRIDGE-035.md.'
