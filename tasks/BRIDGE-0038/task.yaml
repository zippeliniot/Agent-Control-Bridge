title: Periodisches Auto-git-pull fuer den Web-UI-Server
description: 'Der board-Klon (dritter, neutraler Checkout) soll Auftraege aus allen
  Projekten zeigen, unabhaengig davon ob sie ueber den claude- oder codex-Klon gepusht
  wurden. Die Anzeige-Logik ist bereits generisch (liest tasks/*/task.yaml projektuebergreifend),
  es fehlt nur die Aktualitaet - der Web-UI-Prozess sieht nur den lokalen Stand seines
  eigenen Checkouts. Wichtiger, im Code verifizierter Befund: die Web-UI ist entgegen
  ihrem eigenen Hilfetext ("rein lesend") bereits schreibfaehig (Aktions-Endpunkte
  copied/archive/priority committen ueber gitops.git_commit()). Ein periodischer Hintergrund-git-pull
  im selben Prozess kann daher mit einem gerade laufenden Aktions-Commit desselben
  ThreadingHTTPServer kollidieren (mehrere Threads gleichzeitig). Fix: neue git_pull()-Funktion
  in gitops.py (einfacher, idempotenter Fast-Forward-Pull, fail-soft, kein Retry/Rebase
  wie git_commit()). Hintergrund-Thread in cli.py/_cmd_webui, konfigurierbar ueber
  --pull-interval (Standard 30s, 0 deaktiviert, sauberes Herunterfahren ueber stop_event).
  Gemeinsames threading.Lock zwischen Pull-Thread und den bestehenden schreibenden
  Aktions-Endpunkten verhindert Kollisionen. Hilfetext von webui serve korrigiert
  (nicht mehr rein lesend). Tests ohne echte Wartezeiten (kurze Intervalle, direkte
  Funktionsaufrufe statt Sleep-basiertem Timing). Details in work-packages/BRIDGE-038.md.'
