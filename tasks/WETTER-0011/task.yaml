description: 'Zwei von fuenf Tankstellen liefern in einzelnen 15-Min-Zyklen keine
  Daten von Tankerkoenigs prices.php (Station fehlt komplett in der API-Antwort).
  export_tanken_prices.py schreibt das bisher kommentarlos als null/isOpen=false in
  tanken.json und tanken_history.json, der vorherige echte Preis geht verloren (Chart-Loch,
  Flackern der Live-Liste). Fix: bei komplett fehlender Station im API-Response Fallback
  auf letzten bekannten Preis (aus aktuell live stehendem tanken.json) + Warn-Log;
  legitime Sorten-Luecken bei vorhandener Station bleiben unangetastet. Zusaetzlich
  Chart-Y-Achse auf 3 Nachkommastellen (behebt doppelte Achsenbeschriftungen) sowie
  moderate optische Auffrischung (dezente Flaechenfuellung, punktabhaengige Marker-Groesse).'
