title: 'Bugfix: executor/created_by in result.yaml faelschlich hartkodiert auf claude-code'
description: 'In BRIDGE-0040 (erster realer Codex-Lauf) zeigt result.yaml executor:
  claude-code und created_by: claude-code@DES11, obwohl der Lauf real von Codex ausgefuehrt
  wurde. Ursache verifiziert: src/bridge/importer.py::build_result() hat executor="claude-code"
  als hartkodierten Default-Parameter; src/bridge/runner.py::finish() liest das vorhandene
  task.yaml-Feld "executor" nicht aus und reicht es nicht durch. created_by wird zusaetzlich
  aus diesem falschen executor-Wert abgeleitet statt aus dem bereits korrekt vorhandenen
  actor-Parameter (der actor ist im Audit-Trail bereits korrekt, z.B. "codex-executor"
  - nur result.yaml ist betroffen). Betrifft jeden Nicht-Claude-Code-Lauf.'
