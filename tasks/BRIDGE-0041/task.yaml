acceptance_criteria:
- runner.py::finish() laedt das Task-Dokument bereits (current = store.load_task(...))
  - daraus das Feld 'executor' lesen und an importer.import_result()/ build_result()
  durchreichen, statt den Default aus build_result() zu verwenden
- 'importer.py::build_result(): executor-Parameter primaer aus dem Task-Dokument,
  Fallback auf ''claude-code'' nur wenn das Feld dort fehlt (Rueckwaertskompatibilitaet
  fuer alte Tasks ohne executor-Feld)'
- created_by wird aus dem tatsaechlichen actor-Parameter (nicht aus executor) + machine
  gebildet, z.B. f'{actor}@{machine}' - actor ist bereits korrekt vorhanden, wird
  nur an der falschen Stelle nicht verwendet
- 'Neuer Test: Lauf mit task.yaml executor: codex liefert result.yaml executor: codex
  und created_by beginnend mit dem tatsaechlichen actor, nicht mit ''claude-code'''
- 'Neuer Test: Lauf mit task.yaml executor: claude-code (Normalfall) bleibt unveraendert
  korrekt'
- Bestehende Testsuite komplett gruen (aktuell 381 Tests), frisch in isoliertem venv
  verifiziert, tatsaechlich nachgezaehlt
- Keine Aenderung an anderen result.yaml-Feldern (repository, head, changed_files,
  etc.)
